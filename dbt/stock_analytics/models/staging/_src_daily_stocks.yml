# dbt/stock_analytics/models/staging/_src_daily_stocks.yml
# Source definitions for raw Polygon.io daily stock data.

version: 2

sources:
  - name: raw_market
    description: "Raw layer containing Polygon.io daily stock data"
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'MARKET') }}"
    schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'RAW') }}"
    tables:
      - name: DAILY_STOCKS_RAW
        description: "Raw Polygon.io grouped daily rows with ingestion metadata"
