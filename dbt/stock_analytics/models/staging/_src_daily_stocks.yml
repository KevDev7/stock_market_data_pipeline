# dbt/stock_analytics/models/staging/_src_daily_stocks.yml
# Source definitions for raw Polygon daily stock data.

version: 2

sources:
  - name: raw_market
    description: "Raw layer in Snowflake containing Polygon daily stock data"
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'MARKET') }}"
    schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'RAW') }}"
    tables:
      - name: DAILY_STOCKS_RAW
        description: "Raw Polygon grouped daily rows with ingestion metadata"
