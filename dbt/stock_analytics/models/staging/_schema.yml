# dbt/stock_analytics/models/staging/_schema.yml
# Schema definitions and tests for staging models.

version: 2

models:
  - name: stg_daily_stocks
    description: |
      Source-standardized daily stock view with validation flags.
      One row per ticker/date: latest ingestion, then run ID, then ascending
      source payload for repeatable ties. Invalid prices remain flagged here.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, trade_date]
    columns:
      - name: ticker
        description: "Stock ticker symbol"
        tests:
          - not_null

      - name: trade_date
        description: "Trading date"
        tests:
          - not_null

      - name: volume
        description: "Trading volume"

      - name: volume_weighted_avg
        description: "Volume-weighted average price"

      - name: open
        description: "Opening price"

      - name: close
        description: "Closing price"

      - name: high
        description: "Highest price"

      - name: low
        description: "Lowest price"

      - name: num_transactions
        description: "Number of transactions"

      - name: ingested_at
        description: "Timestamp when data was ingested"

      - name: has_volume
        description: "Flag indicating if the record has trading volume (1=yes, 0=no)"

      - name: is_valid_record
        description: "Flag indicating if OHLC prices are valid and consistent (1=valid, 0=invalid)"

  - name: stg_russell3000__constituents
    description: |
      Standardized constituent snapshots, one row per ticker/snapshot date.
      Duplicate source rows prefer highest market value, then descriptive fields.
      Membership validity periods are assigned only in INTERMEDIATE.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, snapshot_date]
    columns:
      - name: ticker
        description: "Stock ticker symbol"
        tests:
          - not_null

      - name: company
        description: "Company name"

      - name: sector
        description: "Industry sector"

      - name: asset_class
        description: "Asset class from the Russell 3000 source file"

      - name: location
        description: "Issuer location from the Russell 3000 source file"

      - name: exchange
        description: "Primary exchange from the Russell 3000 source file"

      - name: currency
        description: "Security currency from the Russell 3000 source file"

      - name: market_currency
        description: "Market currency from the Russell 3000 source file"

      - name: market_value
        description: "Market value of the company at the time of index composition"

      - name: market_weight
        description: "Weight of the stock in the Russell 3000 index"

      - name: snapshot_date
        description: "Date encoded by the source snapshot file; not an inferred membership start."
        tests:
          - not_null
