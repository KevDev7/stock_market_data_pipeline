# dbt/stock_analytics/models/intermediate/_schema.yml
# Schema definitions for intermediate Russell 3000–enriched daily market data.

version: 2

models:
  - name: int_russell3000__membership
    description: |
      Authoritative snapshot-derived constituent membership windows, shared by
      daily enrichment and the history dimension. Each snapshot applies until
      the day before the next available snapshot. The earliest snapshot is
      backcast to membership_history_start (default 2023-01-01), a portfolio
      approximation rather than independently verified historical membership.
      Rebuilt as a table so every consumer sees the same current window policy.
    columns:
      - name: ticker
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, snapshot_date]

  - name: int_russell3000__daily
    description: |
      Filtered and enriched daily stock data for Russell 3000 constituents.

      This incremental table joins daily market data with Russell 3000
      shared snapshot-derived membership windows and sector context. The
      documented earliest-snapshot backcast is not verified historical membership.

      Only rows with a ticker, valid OHLC prices, and positive volume enter this
      analytical base. Previous accepted close, observation count, and first
      observation are established here before any downstream rolling calculations.

      Intended Cadence: One scheduled weekday run; ingestion is currently paused
      Grain: One row per ticker per trade_date
      History: 2+ years
      Materialization: Incremental
      Unique Key: (ticker, trade_date)
      Write behavior: atomic replacement of the recent correction window

    columns:
      - name: ticker
        description: Stock ticker symbol
        tests:
          - not_null

      - name: trade_date
        description: Trading date (market days only)
        tests:
          - not_null

      - name: volume
        description: Daily trading volume (shares traded)

      - name: volume_weighted_avg
        description: |
          Volume-weighted average price (VWAP) for the trading day.
          Represents average execution price weighted by volume.

      - name: open
        description: Opening price for the trading session

      - name: close
        description: Closing price for the trading session

      - name: high
        description: Highest price during the trading session

      - name: low
        description: Lowest price during the trading session

      - name: num_transactions
        description: Total number of trades during the day

      - name: ingested_at
        description: |
          Timestamp when the record was ingested into the raw data layer.
          Used for auditability and data freshness checks.

      - name: has_volume
        description: |
          Binary indicator of trading activity.
          1 = Trading volume greater than zero
          0 = No reported volume

      - name: is_valid_record
        description: |
          Data quality validation flag.
          1 = OHLC prices pass the staging consistency checks.
          All rows in this analytical base have this flag set to 1; positive
          volume is checked separately through has_volume.
        tests:
          - accepted_values:
              values: [1]
              quote: false

      - name: sector
        description: |
          GICS sector classification sourced from Russell 3000
          constituent data and updated during index rebalancing.

      - name: company
        description: Company name from Russell 3000 constituent data

      - name: asset_class
        description: Asset class from Russell 3000 constituent data

      - name: location
        description: Issuer location from Russell 3000 constituent data

      - name: exchange
        description: Primary exchange from Russell 3000 constituent data

      - name: currency
        description: Security currency from Russell 3000 constituent data

      - name: market_currency
        description: Market currency from Russell 3000 constituent data

      - name: index_weight
        description: |
          Weight of the stock within the Russell 3000 index (percentage).
          Updated during periodic index rebalancing.

      - name: observation_count
        description: |
          Running count of accepted observations for this ticker. Gaps do not
          reset the count; it is not a consecutive-trading-day streak.

      - name: yesterday_close
        description: |
          Previous accepted observation's close, across calendar gaps and
          incremental boundaries. NULL for the first accepted observation.

      - name: is_first_observation
        description: |
          1 for the first accepted observation of the ticker in this dataset,
          otherwise 0. Does not claim an actual index-entry or re-entry event.
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, trade_date]

      # Sanity check on index weights
      - dbt_expectations.expect_column_values_to_be_between:
          column_name: index_weight
          min_value: 0
          max_value: 10
