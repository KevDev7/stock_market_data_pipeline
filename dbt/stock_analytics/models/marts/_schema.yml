version: 2

models:
  - name: dim_date
    description: "Conformed trading-date dimension shared by all mart facts."
    columns:
      - name: date_key
        description: "Surrogate date key in YYYYMMDD format."
        tests:
          - not_null
          - unique
      - name: trade_date
        description: "Trading date."
        tests:
          - not_null
          - unique

  - name: dim_sector
    description: "Conformed sector dimension shared by security and sector facts."
    columns:
      - name: sector_key
        description: "Hash key for the sector."
        tests:
          - not_null
          - unique
      - name: sector_name
        description: "Sector name."
        tests:
          - not_null
          - unique

  - name: dim_security
    description: |
      Conformed security dimension at one row per security identity.

      Contains descriptive attributes such as company, sector, exchange,
      currency, and observed price coverage dates. Facts join to this dimension by
      security_key.
    columns:
      - name: security_key
        description: "Hash key for the security."
        tests:
          - not_null
          - unique
      - name: sector_key
        description: "Foreign key to dim_sector."
        tests:
          - not_null
          - relationships:
              to: ref('dim_sector')
              field: sector_key
      - name: ticker
        description: "Observed ticker; the symbol can be reused across distinct identities."
        tests:
          - not_null
      - name: company
        description: "Company name from Massive dated reference data."
      - name: sector_name
        description: "Current sector name."
      - name: exchange
        description: "Primary exchange from Massive dated reference data."
      - name: currency
        description: "Security currency from Massive dated reference data."

  - name: dim_security_history
    description: |
      Type 2 security history dimension built from Massive dated reference
      snapshots.

      Grain: one row per security identity per validity period. This preserves
      dated observed security attributes such as company, SIC industry group,
      exchange, and currency. Quarterly issuer observations are not strict
      as-known-then history; index weights are NULL for this non-index universe.
    columns:
      - name: security_history_key
        description: "Hash key for the security identity/version row."
        tests:
          - not_null
          - unique
      - name: security_key
        description: "Identity hash; FIGI preferred with an issuer/ticker fallback."
        tests:
          - not_null
      - name: ticker
        description: "Stock ticker symbol."
        tests:
          - not_null
      - name: sector_key
        description: "Foreign key to dim_sector."
        tests:
          - not_null
          - relationships:
              to: ref('dim_sector')
              field: sector_key
      - name: valid_from
        description: "First date this security version is valid."
        tests:
          - not_null
      - name: valid_to
        description: "Last date this security version is valid."
        tests:
          - not_null
      - name: is_current
        description: "1 when this is the current open-ended security version."
        tests:
          - not_null
    tests:
      - unique:
          column_name: "security_key || '-' || TO_VARCHAR(valid_from) || '-' || TO_VARCHAR(valid_to)"

  - name: fct_security_daily_momentum
    description: |
      Security-day fact table with OHLCV measures, moving averages, RSI,
      crossover flags, and other technical momentum indicators.

      Grain: one row per security_key per date_key.
    columns:
      - name: security_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_security')
              field: security_key
      - name: sector_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_sector')
              field: sector_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: trade_date
        tests:
          - not_null
      - name: is_first_observation
        description: "1 for the ticker's first accepted observation, not necessarily an index-entry event."
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: volume
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: rel_vol
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: 0
              row_condition: "rel_vol IS NOT NULL"
              strictly: true
      - name: avg_gain_14
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: 0
              row_condition: "avg_gain_14 IS NOT NULL"
      - name: avg_loss_14
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: -1e-8
              row_condition: "avg_loss_14 IS NOT NULL"
      - name: rsi
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
              where: "rsi IS NOT NULL"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [security_key, date_key]
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: ref('calc_security_daily_momentum')
          compare_row_condition: "trade_date BETWEEN '{{ var('analysis_start', '2024-01-01') }}'::DATE AND '{{ var('analysis_end', '2025-12-31') }}'::DATE"

  - name: fct_market_daily_breadth
    description: |
      Market-day aggregate fact table for provider-classified common-stock breadth and market
      health measures.

      Grain: one row per date_key.
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: trade_date
        tests:
          - not_null
          - unique
      - name: stocks_traded
        tests:
          - not_null
      - name: pct_market_over_sma20
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: 0
              row_condition: "pct_market_over_sma20 IS NOT NULL"
      - name: market_rsi
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: false
      - name: ad_percentage
        tests:
          - dbt_utils.accepted_range:
              min_value: -1
              max_value: 1
              inclusive: false
      - name: up_down_volume_ratio
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: 0
              row_condition: "up_down_volume_ratio IS NOT NULL"
      - name: high_low_index
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: false

  - name: fct_sector_daily_breadth
    description: |
      Sector-day aggregate fact table for sector breadth and technical
      participation measures.

      Grain: one row per sector_key per date_key.
    columns:
      - name: sector_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_sector')
              field: sector_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: trade_date
        tests:
          - not_null
      - name: stocks_traded
        tests:
          - not_null
    tests:
      - unique:
          column_name: "sector_key || '-' || TO_VARCHAR(date_key)"

  - name: fct_security_current_snapshot
    description: |
      Latest security snapshot fact table used for screeners and current-state
      dashboard views.

      Grain: one row per security_key.
    columns:
      - name: security_key
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_security')
              field: security_key
      - name: sector_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_sector')
              field: sector_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: latest_trade_date
        tests:
          - not_null
      - name: performance_percentile
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 1
