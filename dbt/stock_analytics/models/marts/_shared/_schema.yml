version: 2

models:
  - name: calc_security_daily_momentum
    description: "Shared internal MARTS calculation; computes momentum once from accepted INTERMEDIATE history for all downstream analytical products."
    columns:
      - name: ticker
        tests:
          - not_null
      - name: trade_date
        tests:
          - not_null
      - name: volume
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: rel_vol
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: 0
              row_condition: "rel_vol IS NOT NULL"
              strictly: true
      - name: avg_gain_14
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: 0
              row_condition: "avg_gain_14 IS NOT NULL"
      - name: avg_loss_14
        tests:
          - dbt_expectations.expect_column_min_to_be_between:
              min_value: 0
              row_condition: "avg_loss_14 IS NOT NULL"
      - name: rsi
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
              where: "rsi IS NOT NULL"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [security_key, trade_date]
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: ref('int_market__daily')
